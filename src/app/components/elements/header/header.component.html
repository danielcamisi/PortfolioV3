
  <header class="header">
    <a class="logo" routerLink="/home" (click)="closeMenu()">
      <h1>Dan</h1>
    </a>

    <nav class="navbar">
      <ul>
        <li><a routerLink="/home" routerLinkActive="active-link">Home</a></li>
        <li>
          <a routerLink="/history" routerLinkActive="active-link">
            Minha História
          </a>
        </li>
        <li>
          <a routerLink="/projects" routerLinkActive="active-link">Projetos</a>
        </li>
        <li>
          <a routerLink="/feedback" routerLinkActive="active-link">Feedback</a>
        </li>
        <li>
          <a routerLink="/contacts" routerLinkActive="active-link">Contatos</a>
        </li>
      </ul>
    </nav>

    <button
      id="buttonmenu"
      (click)="menuFunc()"
      [attr.aria-expanded]="isVisible"
      aria-label="Abrir menu"
    >
      <mat-icon>{{ isVisible ? 'close' : 'menu' }}</mat-icon>
    </button>
  </header>

  <nav class="sidenav-container" [class.open]="isVisible">
    <div class="sidenav-content">
      <a routerLink="/home" routerLinkActive="active-link" (click)="closeMenu()">Home</a>
      <a routerLink="/history" routerLinkActive="active-link" (click)="closeMenu()">Minha História</a>
      <a routerLink="/projects" routerLinkActive="active-link" (click)="closeMenu()">Projetos</a>
      <a routerLink="/feedback" routerLinkActive="active-link" (click)="closeMenu()">Feedback</a>
      <a routerLink="/contacts" routerLinkActive="active-link" (click)="closeMenu()">Contatos</a>
    </div>
  </nav>
