<!-- Projetos Pessoais -->
<h1 style="text-align: center; font-weight: bolder; padding-block: 1.5em">
  Meus Projetos e Conquistas
</h1>
<section class="personal-projects">
  <h2 style="text-align: start; padding-left: 10em">Projetos Pessoais</h2>
  <hr
    style="
      width: 9em;
      margin-left: 15em;
      border: 2.5px solid #fff;
      border-radius: 20px;
      margin-bottom: 5em;
    "
  />

  <!-- Verifica se existem projetos pessoais -->
  <div *ngIf="getPersonalProjects().length > 0; else noPersonalProjects">
    <div class="projects-grid">
      <div class="project-card" *ngFor="let project of getPersonalProjects()">
        <!-- Imagem do projeto -->
        <div class="project-image-container" *ngIf="project.img">
          <img
            [src]="getFullImagePath(project.img)"
            [alt]="project.projectname"
            class="project-image"
            loading="lazy"
          />
        </div>

        <!-- Conteúdo do projeto -->
        <div class="project-content">
          <h3 class="project-title">{{ project.projectname }}</h3>
          <p class="project-description">{{ project.desc }}</p>

          <!-- Tecnologias utilizadas -->
          <div class="technologies" *ngIf="hasTechnologies(project)">
            <div class="tech-stack">
              <img
                *ngIf="project.technology"
                [src]="getTechnologyImage(project.technology)"
                [alt]="project.technology"
                class="tech-icon"
                [title]="project.technology"
              />
              <img
                *ngIf="project.secondTechnology"
                [src]="getFrameworkImage(project.secondTechnology)"
                [alt]="project.secondTechnology"
                class="tech-icon"
                [title]="project.secondTechnology"
              />
              <img
                *ngIf="project.thirdTechnology"
                [src]="getDatabaseImage(project.thirdTechnology)"
                [alt]="project.thirdTechnology"
                class="tech-icon"
                [title]="project.thirdTechnology"
              />
            </div>
          </div>

          <!-- Botão de ação -->
        </div>
        <button
          class="project-button"
          (click)="redTo(project.url)"
          [disabled]="!project.url"
        >
          {{ project.url ? "Acessar Projeto" : "Indisponível" }}
        </button>
      </div>
    </div>
  </div>

  <ng-template #noPersonalProjects>
    <div class="no-projects-message">
      <p style="text-align: center">
        Nenhum projeto pessoal disponível no momento.
      </p>
    </div>
  </ng-template>
</section>
